<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · Husay</title><link rel="stylesheet" href="/app.css"><script src="/admin.js?v=username-1" defer></script></head><body class="bg-slate-50 text-slate-800"><main class="max-w-6xl mx-auto p-6 lg:p-12">
<a href="/" class="text-teal-800">← Back to reviewer and HTML imports</a><h1 class="text-3xl font-bold mt-6">Administration</h1><p id="message" role="status" class="mt-4"></p>
<div id="admin-content" hidden>
<section id="users-section" hidden class="panel p-6 mt-6"><h2 class="text-xl font-bold">User roles</h2><p class="mt-3 text-sm">Accounts appear after registration. Admins can add and import questions. Users can study and save their own progress.</p><div id="users" class="mt-4 space-y-3"></div></section>
<section class="panel p-6 mt-6"><h2 class="text-xl font-bold">Add a question</h2><form id="question-form" class="space-y-4 mt-4">
<div class="grid md:grid-cols-2 gap-4"><label>Subject<select id="category"><option>Numerical Ability</option><option>Verbal Ability</option><option>Analytical Ability</option><option>Clerical Ability</option><option>General Information</option></select></label><label>Exam level<select id="level"><option>Professional</option><option>Subprofessional</option><option>Both</option></select></label></div>
<label class="block">Difficulty<select id="difficulty"><option>Easy</option><option>Moderate</option><option>Hard</option></select></label><label class="block">Question<textarea id="prompt" required maxlength="3000"></textarea></label>
<div class="grid md:grid-cols-2 gap-4"><label>Option A<input id="option-0" required></label><label>Option B<input id="option-1" required></label><label>Option C<input id="option-2" required></label><label>Option D<input id="option-3" required></label></div>
<label class="block">Correct answer<select id="answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label><label class="block">Why is this correct?<textarea id="explanation" required></textarea></label><label class="block">Solving steps (one per line; required for numerical questions)<textarea id="steps"></textarea></label><button class="primary" type="submit">Add to question bank</button>
</form></section></div></main></body></html>
