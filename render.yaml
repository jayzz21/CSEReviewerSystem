services:
  - type: web
    name: husay-reviewer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /Login
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ConnectionStrings__Study
        sync: false
